<!doctype html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f5f2eb" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#111714" media="(prefers-color-scheme: dark)" />
    <meta
      name="description"
      content="Math Notes — un quaderno di calcolo personale, semplice e locale."
    />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Math Notes" />
    <title>Math Notes</title>
    <link rel="apple-touch-icon" href="./assets/icon.svg" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="preconnect" href="https://cdnjs.cloudflare.com" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&family=Newsreader:opsz,wght@6..72,500;6..72,600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
    <script
      defer
      src="https://cdnjs.cloudflare.com/ajax/libs/mathjs/15.1.0/math.min.js"
      referrerpolicy="no-referrer"
    ></script>
    <script defer src="app.js"></script>
  </head>
  <body>
    <a class="skip-link" href="#notebook">Vai al quaderno</a>
    <div class="app-shell">
      <aside class="sidebar" aria-label="Le tue pagine">
        <div class="brand-row">
          <a class="brand" href="./" aria-label="Math Notes, home">
            <span class="brand-mark">∑</span>
            <span>Math Notes</span>
          </a>
          <button class="icon-button sidebar-close" id="sidebarClose" aria-label="Chiudi elenco pagine">×</button>
        </div>

        <div class="sidebar-actions">
          <button class="new-page-button" id="newPageButton">
            <span aria-hidden="true">＋</span> Nuova pagina
          </button>
        </div>

        <nav class="page-list" id="pageList" aria-label="Pagine salvate"></nav>

        <div class="sidebar-footer">
          <span class="storage-indicator"><i></i> Salvato su questo dispositivo</span>
          <button class="text-button" id="importButton">Importa</button>
          <button class="text-button" id="exportButton">Esporta</button>
          <input id="importFile" type="file" accept="application/json,.json" hidden />
        </div>
      </aside>

      <main class="workspace">
        <header class="topbar">
          <button class="icon-button menu-button" id="menuButton" aria-label="Apri elenco pagine">☰</button>
          <div class="crumb"><span class="crumb-dot"></span> Quaderno personale</div>
          <div class="topbar-actions">
            <span class="save-state" id="saveState">Salvato</span>
            <button class="icon-button icon-button-svg" id="settingsButton" title="Impostazioni" aria-label="Apri impostazioni">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h16"/><circle cx="9" cy="6" r="2.1" fill="currentColor"/><circle cx="15" cy="12" r="2.1" fill="currentColor"/><circle cx="11" cy="18" r="2.1" fill="currentColor"/></svg>
            </button>
            <button class="icon-button" id="duplicateButton" title="Duplica pagina" aria-label="Duplica pagina">⧉</button>
            <button class="icon-button icon-button-svg danger-button" id="deletePageButton" title="Elimina pagina" aria-label="Elimina pagina">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/></svg>
            </button>
          </div>
        </header>

        <section class="notebook" id="notebook" aria-label="Editor di note matematiche">
          <div class="note-heading">
            <input id="pageTitle" class="page-title" aria-label="Titolo pagina" maxlength="80" />
            <p id="pageMeta" class="page-meta"></p>
          </div>

          <div class="insert-control">
            <button class="insert-button" id="insertButton" type="button" aria-label="Inserisci simbolo o funzione" aria-expanded="false" aria-controls="insertMenu">+</button>
            <div class="insert-menu" id="insertMenu" hidden>
              <span class="insert-menu-label">Inserisci</span>
              <div class="symbol-group">
                <button data-insert="√()" data-caret="-1" title="Radice quadrata">√</button>
                <button data-insert="^2" title="Al quadrato">x²</button>
                <button data-insert="^" title="Potenza">xⁿ</button>
                <button data-insert="×" title="Moltiplicazione">×</button>
                <button data-insert="÷" title="Divisione">÷</button>
                <button data-insert="()" data-caret="-1" title="Parentesi">( )</button>
              </div>
              <div class="symbol-group">
                <button data-insert="log()" data-caret="-1">log</button>
                <button data-insert="ln()" data-caret="-1">ln</button>
                <button data-insert="sin()" data-caret="-1">sin</button>
                <button data-insert="cos()" data-caret="-1">cos</button>
                <button data-insert="abs()" data-caret="-1">|x|</button>
                <button data-insert="π" title="Pi greco">π</button>
                <button data-insert="e" title="Numero di Nepero">e</button>
              </div>
            </div>
          </div>

          <div class="cells" id="cells" aria-live="polite"></div>
          <button class="add-line-button" id="addLineButton"><span>＋</span> Aggiungi riga</button>
        </section>
      </main>
    </div>

    <div class="toast-region" id="toastRegion" aria-live="polite" aria-atomic="true"></div>

    <dialog class="settings-dialog" id="settingsDialog" aria-labelledby="settingsTitle">
      <form method="dialog">
        <header>
          <div>
            <p class="eyebrow">PREFERENZE</p>
            <h2 id="settingsTitle">Impostazioni</h2>
          </div>
          <button class="icon-button" value="close" aria-label="Chiudi impostazioni">×</button>
        </header>

        <section class="settings-section">
          <label class="setting-row" for="precisionSetting">
            <span><strong>Precisione risultati</strong><small>Cifre significative nei calcoli</small></span>
            <select id="precisionSetting" name="precision">
              <option value="6">6 cifre</option>
              <option value="10">10 cifre</option>
              <option value="12">12 cifre</option>
              <option value="14">14 cifre</option>
            </select>
          </label>
          <label class="setting-row" for="paletteSetting">
            <span><strong>Palette</strong><small>Colori dell'app</small></span>
            <select id="paletteSetting" name="palette">
              <option value="sage">Verde e panna</option>
              <option value="bordeaux">Bordeaux e panna</option>
              <option value="midnight">Blu notte e sabbia</option>
              <option value="plum">Prugna e rosa cipria</option>
            </select>
          </label>
          <label class="setting-row" for="themeSetting">
            <span><strong>Aspetto</strong><small>Chiaro, scuro o sistema</small></span>
            <select id="themeSetting" name="theme">
              <option value="system">Sistema</option>
              <option value="light">Chiaro</option>
              <option value="dark">Scuro</option>
            </select>
          </label>
        </section>

        <section class="settings-section">
          <h3>Backup dei dati</h3>
          <p class="settings-copy">Le note restano su questo dispositivo. Salva un file JSON per conservarne una copia.</p>
          <div class="data-actions">
            <button class="button secondary" id="settingsExportButton" type="button">Esporta JSON</button>
            <button class="button secondary" id="settingsImportButton" type="button">Importa JSON</button>
          </div>
          <button class="text-button danger-text" id="resetDataButton" type="button">Ripristina dati iniziali</button>
        </section>
        <p class="app-version" id="appVersion"></p>
      </form>
    </dialog>
  </body>
</html>
